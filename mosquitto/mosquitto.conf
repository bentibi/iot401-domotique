# Broker MQTT local : uniquement sur le réseau privé Docker.
listener 8883 0.0.0.0
protocol mqtt
allow_anonymous false

# Le client présente un certificat signé par notre autorité locale.
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

# Identité X.509 (CN) -> topics autorisés.
acl_file /mosquitto/config/acl.conf

persistence false
connection_messages true
log_dest stdout
log_type error
log_type warning
log_type notice
