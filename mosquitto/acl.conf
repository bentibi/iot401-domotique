# Chaque capteur ne publie que sur son propre topic.
# Le nom du compte est récupéré dans le CN du certificat mTLS.
user presence-entree
topic write maison/presence-entree/etat

user temp-salon
topic write maison/temp-salon/temperature

user temp-chambre
topic write maison/temp-chambre/temperature

user temp-cuisine
topic write maison/temp-cuisine/temperature

# Le superviseur peut lire les topics, mais pas publier.
user superviseur
topic read maison/#

# Identité spéciale du test d'intrusion, hors allowlist du superviseur.
# A RETIRER pour un déploiement réel.
user capteur-test
topic write maison/capteur-test/etat
